version: 2
updates:
  # Automatización de actualizaciones para GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Actualizaciones de dependencias para el estudio de video (Remotion)
  - package-ecosystem: "npm"
    directory: "/video_edition/remotion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(remotion)"
