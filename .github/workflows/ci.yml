name: CI - Calidad y Seguridad

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-lint:
    name: Verificación de Sintaxis Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar sintaxis de scripts Python
        run: |
          python -m compileall -q tools/ video_edition/tools/

  remotion-check:
    name: Validación de TypeScript y Remotion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: video_edition/remotion/package-lock.json

      - name: Instalar dependencias
        working-directory: video_edition/remotion
        run: npm ci

      - name: Comprobación de tipos (TypeScript)
        working-directory: video_edition/remotion
        run: npx tsc --noEmit

  security-hygiene:
    name: Auditoría de Secretos y Archivos Prohibidos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Verificar ausencia de archivos .env y credenciales rastreadas
        run: |
          if git ls-files | grep -E '(\.env$|\.env\..*|credenciales\.md|.*\.log$)'; then
            echo "::error::Se detectaron archivos sensibles o logs rastreados en git."
            exit 1
          else
            echo "Árbol de trabajo limpio de credenciales y volcados de logs."
          fi
