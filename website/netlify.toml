# website/netlify.toml
# Configuración de despliegue para Craft to Nation en Netlify
# Protege la cuota del plan gratuito cancelando builds automáticos por git push.

[build]
  publish = "."
  ignore = "exit 0"

# --- RFC 9116 Security Policy ---
[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301

# --- Privacy Policy Aliases (RFC / Crawler & Bot Compliance) ---
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy-notice"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/legal/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/legal/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/legal/privacy-notice"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/policies/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/trust/privacy-policy"
  to = "/privacy.html"
  status = 301

